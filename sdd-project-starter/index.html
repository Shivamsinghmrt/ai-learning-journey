<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDD Project Starter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f4f7fb;
      color: #1f2937;
    }
    .card {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
    button {
      padding: 0.7rem 1rem;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    textarea, input {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }
    .result {
      margin-top: 1rem;
      padding: 1rem;
      background: #eff6ff;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SDD Project Starter</h1>
    <p>This page is ready for your next AI project idea.</p>

    <label for="prompt">Describe your request</label>
    <textarea id="prompt" rows="5" placeholder="Enter your prompt here"></textarea>

    <button onclick="submitPrompt()">Run</button>

    <div id="result" class="result">Waiting for input...</div>
  </div>

  <script>
    async function submitPrompt() {
      const prompt = document.getElementById('prompt').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerText = 'Processing...';

      try {
        const response = await fetch('http://127.0.0.1:5000/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();
        resultDiv.innerText = data.reply || 'No reply received.';
      } catch (error) {
        resultDiv.innerText = 'Error connecting to backend: ' + error.message;
      }
    }
  </script>
</body>
</html>
